options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_HOSTNAME: asia-northeast3-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: sinsin-doctor
  _SERVICE_NAME: sinsin-doctor
  _DEPLOY_REGION: asia-northeast3
  _RUNTIME_SERVICE_ACCOUNT: sinsin-doctor-mockup-sa@sinsin-486209.iam.gserviceaccount.com

steps:
  - id: Validate static sources
    name: alpine:3.21
    entrypoint: sh
    args:
      - -ceu
      - |
        test -s index.html
        test -s demo.html
        test -s HANDOFF.md
        test -s API.md
        test -s ESTIMATE_AND_API_REVIEW.md

  - id: Build image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA
      - .

  - id: Push image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA

  # ⚠️ 이 단계는 `--no-invoker-iam-check` 로 배포한다 — 서비스가 인증 없이 열린다.
  #
  # 이 저장소가 **완전한 정적 목업**이라서 허용한 값이다.
  # 확인(2026-08-30): index.html·demo.html 에 fetch·axios·XMLHttpRequest·WebSocket 이
  # 한 군데도 없고, 외부 주소는 SVG 네임스페이스뿐이다. 환자 데이터로 가는 길이 없다.
  #
  # **데이터를 부르는 화면에는 이 설정을 재사용하지 말 것.**
  # 이 파일을 복사해 새 서비스를 배포하려 한다면, 먼저 그 화면이 어떤 데이터에
  # 닿는지부터 보고 그 줄을 지운 뒤 invoker IAM 으로 접근을 통제한다.
  # 목업에서 괜찮았다는 이유로 따라오면 그때는 진짜 구멍이 된다.
  - id: Deploy Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "$_SERVICE_NAME" \
          --project "$PROJECT_ID" \
          --image "$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA" \
          --region "$_DEPLOY_REGION" \
          --service-account "$_RUNTIME_SERVICE_ACCOUNT" \
          --no-invoker-iam-check \
          --port 8080 \
          --min-instances 0 \
          --max-instances 2 \
          --memory 256Mi \
          --cpu 1 \
          --concurrency 80 \
          --quiet

  - id: Verify deployment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        URL="$$(gcloud run services describe "$_SERVICE_NAME" \
          --project "$PROJECT_ID" \
          --region "$_DEPLOY_REGION" \
          --format='value(status.url)')"

        for attempt in 1 2 3 4 5; do
          if curl --fail --silent --show-error "$$URL/health" >/dev/null \
            && curl --fail --silent --show-error "$$URL/" >/dev/null \
            && curl --fail --silent --show-error "$$URL/demo.html" >/dev/null \
            && test "$$(curl --silent --output /dev/null --write-out '%{http_code}' "$$URL/demo")" = 308 \
            && test "$$(curl --silent --output /dev/null --write-out '%{http_code}' "$$URL/demo/")" = 308 \
            && curl --fail --silent --show-error --location "$$URL/demo" >/dev/null \
            && curl --fail --silent --show-error --location "$$URL/demo/" >/dev/null; then
            exit 0
          fi
          sleep 10
        done
        exit 1

images:
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_IMAGE_NAME:$COMMIT_SHA
